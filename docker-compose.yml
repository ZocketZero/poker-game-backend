version: "3.9"

services:
  mongodb:
    image: docker.io/mongo:7
    container_name: poker-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: poker_admin
      MONGO_INITDB_ROOT_PASSWORD: poker_secret
      MONGO_INITDB_DATABASE: poker_db
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
