[package]
name = "poker-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
actix-web = "4"
actix-ws = "0.3"
actix-rt = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Database
mongodb = "3"

# Auth
jsonwebtoken = "9"
bcrypt = "0.17"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
thiserror = "2"

# Game engine
poker_engine = { path = "../poker-engine" }
actix-cors = "0.7.2"
